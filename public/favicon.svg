  <path d="M10 17 h15 l4 6 h25 a3 3 0 0 1 3 3 v24 a3 3 0 0 1 -3 3 H13 a3 3 0 0 1 -3 -3 Z" fill="#c9a75f"/>
  <!-- typed sheet peeking out -->
  <rect x="15" y="14" width="33" height="14" rx="2" fill="#f1e9d5"/>
  <rect x="19" y="18" width="20" height="2" rx="1" fill="#8a7d5f"/>
  <rect x="19" y="22" width="14" height="2" rx="1" fill="#b3a37c"/>
  <!-- folder front flap -->
  <path d="M7 27 h50 a2 2 0 0 1 2 2.2 l-4.2 21.2 a3.4 3.4 0 0 1 -3.3 2.6 H12.5 a3.4 3.4 0 0 1 -3.3 -2.6 L5 29.2 A2 2 0 0 1 7 27 Z" fill="#e0c184"/>
  <!-- flap highlight -->
